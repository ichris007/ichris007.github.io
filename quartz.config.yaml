# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Lifein 栖身·精进
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-MSZMTLM3JH
  locale: zh-CN
  baseUrl: lifein.vip
  ignorePatterns:
    - Private
    - Templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Inter
      body: Inter
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 10
      display: desktop-only
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
  - source: "@quartz-community/remove-draft"
    enabled: false
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: false
  - source: "@quartz-community/content-page"
    enabled: true
  # 官方 folder-page 仅提供「日期 | 标题 | 标签」简版列表，已由本地
  # folder-listing 插件替代（ssp.sh/brain 风格：日期 | 标题+描述+标签）
  - source: "@quartz-community/folder-page"
    enabled: false
  # 本地插件：文件夹页列表——日期左列 + 标题 + 描述 + #标签 pill
  - source: ./folder-listing
    enabled: true
    options:
      showFolderCount: true
      showSubfolders: true
      showDescription: true
      showTags: true
      tagPrefix: "#"
      prefixFolders: false
  # 官方 tag-page 的列表为「日期 | 标题 | 右侧标签」，已由本地
  # tag-listing 插件替代（参考样式：日期 | 标题 + 标签下方一行 + 分割线）
  - source: "@quartz-community/tag-page"
    enabled: false
  # 本地插件：标签页列表——日期左列 + 标题 + 标签（下方纯文本）+ 条目分割线
  - source: ./tag-listing
    enabled: true
    options:
      numPages: 10
      prefixTags: true
      showCount: true
      showTags: true
      tagPrefix: ""
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 20
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: true
    options:
      provider: giscus
      options:
        repo: ichris007/ichris007.github.io
        repoId: R_kgDOSUGAuw
        category: Announcements
        categoryId: DIC_kwDOSUGAu84C8VHC
        mapping: pathname
        strict: false
        reactionsEnabled: true
        inputPosition: bottom
        lang: zh-CN
    layout:
      position: afterBody
      priority: 30
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        科叔: https://github.com/ichris007
        Obsidian Garden Gallery: https://vaults.obsidian-community.com/
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
    options:
      title: 最近更新
      limit: 5
      showTags: false
      linkToMore: tags
    layout:
      position: left
      priority: 60
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: false
    order: 50
  - source: ./hreflang
    enabled: true
    order: 95
  - source: ./site-nav
    enabled: true
    options:
      brand: Lifein OS
      links:
        - text: 首页
          href: index
        - text: Lifein实践
          href: lifein-os实践与思考
        - text: 插件
          href: 插件
        - text: 脚本
          href: 脚本
        - text: 样式
          href: 样式
        - text: Obsidian资料
          href: obsidian资料
        - text: 关于
          href: 关于-lifein
        - text: EN
          href: en
    order: 40
    layout:
      position: header
      priority: 10
  - source: ./homepage-notes
    enabled: true
    options:
      title: 最近更新
      limit: 8
      newDays: 30
      showMoreLink: true
    order: 56
    layout:
      position: afterBody
      priority: 25
  - source: ./homepage-graph
    enabled: true
    options:
      title: 关系图谱
      caption: 全站关系图谱 · 悬停查看 · 点击跳转
      height: 420px
    order: 55
    layout:
      position: afterBody
      priority: 28
  # 本地插件：图谱库本地化——把 graph 插件动态加载的 jsdelivr d3/pixi
  # 重定向到站内副本（quartz/static/vendor-libs/），国内网络也能渲染图谱
  - source: ./graph-libs
    enabled: true
    options: {}
    order: 94
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      template: top-nav
    folder:
      template: top-nav
      exclude:
        - comments
        - recent-notes
        - backlinks
    tag:
      template: top-nav
      exclude:
        - comments
        - recent-notes
        - backlinks
    bases: {}
